         <script type="">
        (function() {
            'use strict';

            const contadores = {
                pista: { 
                    valor: 4309, 
                    formato: (val) => val.toLocaleString('pt-BR') + 'm',
                    decimal: 0
                },
                curvas: { 
                    valor: 15, 
                    formato: (val) => val,
                    decimal: 0
                },
                fundacao: { 
                    valor: 1940, 
                    formato: (val) => val,
                    decimal: 0
                },
                capacidade: { 
                    valor: 60, 
                    formato: (val) => val + 'K',
                    decimal: 0
                }
            };

            const animationDuration = 2500;
            const fps = 60;
            const frameDuration = 1000 / fps;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function animateCounter(id, config) {
                const element = document.getElementById(id);
                if (!element) return;

                const startTime = performance.now();
                let lastFrameTime = startTime;

                function updateCounter(currentTime) {
                    // Limitar FPS
                    if (currentTime - lastFrameTime < frameDuration) {
                        requestAnimationFrame(updateCounter);
                        return;
                    }
                    lastFrameTime = currentTime;

                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / animationDuration, 1);
                    const easedProgress = easeOutCubic(progress);
                    
                    const currentValue = config.valor * easedProgress;
                    
                    if (config.decimal > 0) {
                        element.textContent = config.formato(parseFloat(currentValue.toFixed(config.decimal)));
                    } else {
                        element.textContent = config.formato(Math.floor(currentValue));
                    }

                    if (progress < 1) {
                        requestAnimationFrame(updateCounter);
                    } else {
                        // Garantir valor final exato
                        element.textContent = config.formato(config.valor);
                    }
                }

                requestAnimationFrame(updateCounter);
            }

            // Iniciar animações quando a página carregar
            function startAnimations() {
                Object.entries(contadores).forEach(([id, config]) => {
                    animateCounter(id, config);
                });
            }

            // Intersection Observer para reiniciar animações quando visível
            const observerOptions = {
                threshold: 0.3,
                rootMargin: '0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Pequeno delay para garantir que os cards apareçam primeiro
                        setTimeout(startAnimations, 300);
                    }
                });
            }, observerOptions);

            // Inicialização
            function init() {
                const container = document.querySelector('.interlagos-stats-container');
                if (container) {
                    observer.observe(container);
                    // Iniciar imediatamente se já estiver visível
                    if (container.getBoundingClientRect().top < window.innerHeight) {
                        setTimeout(startAnimations, 600);
                    }
                }
            }

            // Aguardar DOM carregar
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
